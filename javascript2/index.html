<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<script>


function valor1(){
    arg=25
    var raiz = Math.sqrt(arg);
    alert('A raiz quadrada de ' + arg + ' é: ' + raiz);
}
function valor2(){
    arg=36
    var raiz = Math.sqrt(arg);
    alert('A raiz quadrada de ' + arg + ' é: ' + raiz);
}
function valor3(){
    arg=49
    var raiz = Math.sqrt(arg);
    alert('A raiz quadrada de ' + arg + ' é: ' + raiz);
}

function escrevernaDiv(texto){
    document.getElementById("minhaDiv").innerHTML = texto;

}
function escreve2(){
    texto = prompt("Digite o texto que deseja escrever na div:")
    document.getElementById("escreve2").innerHTML = texto;
}

function numero(){
    var input= prompt("Digite o número de elementos que deseja mostrar:")
    var n = parseInt(input);
    if (isNaN(n) ||  n<=0 ) {
        alert("Por favor, digite um número válido maior que zero.");
        return;
}
    var div = document.getElementById("numerosInput");
    div.innerHTML = "";
    for (var i = 1; i <= n; i++) {
        div.innerHTML += i + "<br>";
    }
}

function numeroescreverNumerosInput(){
    var input= document.getElementById("numerosInput")
    var n = parseInt(input.value);
    if (isNaN(n) ||  n<=0 ) {
        alert("Por favor, digite um número válido maior que zero.");
        return;
}
    var div = document.getElementById("numerosInput");
    div.innerHTML = "";
    for (var i = 1; i <= n; i++) {
        div.innerHTML += i + "<br>";
    }
}

</script>
<body>

    <h1> Raiz Quadrada</h1>

    <button onclick="valor1()">Raiz de 25</button>
    <br>
    <br>
    <button onclick="valor2()">Raiz de 36</button>
    <br>
    <br>
    <button onclick="valor3()">Raiz de 49</button>
    <br>
    <br>
    <hr>
    
    <h1> Escrevendo na div </h1>
    <button onclick="escrevernaDiv('<h2> Programação Web </h2>')">Escrever</button>
    <div id="minhaDiv"></div>
    <hr>
    
    <h1> Escrevendo texto dinâmico </h1>
    <button onclick="escreve2()">Escreve</button> <br> <br>
    <div id="escreve2"></div>

    <hr>
    <h1> Desafio </h1>
    <button onclick="numero()">Mostrar Números</button> <br> <br>
    <div id="numerosInput"></div>

    <hr>
    <h1>Desafio com Input</h1>
    <label for="numeroInput>Digite o valor de N":</label>
    <input type="number" id="numeroInput" placeholder="Digite um número" min="1">
    <button onclick="escreverNumerosInput()">Escrever Números</button>
    <br>
    <br>
    <div id="numerosInput"></div>
</body>
</html>
