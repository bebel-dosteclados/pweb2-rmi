<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let pilhaPessoas = Array();

            pilhaPessoas[0] = 'Ana';

            pilhaPessoas[5] = 'Fernanda';
            pilhaPessoas[6] = 'Gabriela';

          


        function mostrarpilhaPessoas() {
        
        const container = document.getElementById('minhaDiv');

                 var tag = '<h5>' + i + ' - ' + pilhaPessoas[i] + '</h5>';
                 container.innerHTML += tag;      
            }      
        }


        function posicaoPessoas(){
            var indice = prompt("Qual posição da lista deseja consultar?");
            alert(pilhaPessoas[indice]);

        }

        function adicionar(){
            var nome=prompt('Qual o nome da pessoa?');
            pilhaPessoas.push(nome);
        }


        function remover() {
            if (pilhaPessoas.length ===0) {
                alert('A pilha está vazia!');

            }

</script>
</head>
<body>

    <h1> lista de pessoas</h1>

    <button onclick="adicionar()">Adicionar pessoas </button>

    <hr>
</body>
