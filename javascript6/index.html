<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atividade</title>
</head>
<body>
<script>

  let pilhaPessoas = [];

  let indiceEdicao = null; // controla se estamos editando alguém

  function mostrarLista() {
    const corpo = document.getElementById('tabelaCorpo');
    corpo.innerHTML = '';

    for (let i = 0; i < pilhaPessoas.length; i++) {
      const pessoa = pilhaPessoas[i];

      const linha =
        "<tr>" +
          "<td>" + i + "</td>" +
          "<td>" + pessoa.nome + "</td>" +
          "<td>" + pessoa.regime + "</td>" +
          "<td>" + pessoa.cargaHoraria + "h</td>" +
          "<td>" +
            "<div class='mt-3 d-flex gap-2'>" +
              "<button class='btn btn-secondary' onclick='editarContato(" + i + ")'>Editar</button>" +
              "<button class='btn btn-danger' onclick='removerContato(" + i + ")'>Remover</button>" +
            "</div>" +
          "</td>" +
        "</tr>";

      corpo.innerHTML += linha;
    }
  }

  function limpaCampos() {
    document.getElementById('nome').value = '';
    document.getElementById('regime').value = '';
    document.getElementById('cargaHoraria').value = '';
    indiceEdicao = null;
  }

  function posicao() {
    const indice = Number(prompt('Qual posição da lista deseja consultar?'));

    if (indice < 0 || indice >= pilhaPessoas.length) {
      alert('Posição inválida!');
      return;
    }

    const pessoa = pilhaPessoas[indice];

    alert(
      'Na posição ' + indice +
      ' está: Nome: ' + pessoa.nome +
      ' - Regime: ' + pessoa.regime +
      ' - Carga Horária: ' + pessoa.cargaHoraria + 'h'
    );
  }

  function limparLista() {
    pilhaPessoas = [];
    mostrarLista();
  }

  function remover() {
    if (pilhaPessoas.length === 0) {
      alert('A pilha está vazia!');
    } else {
      const removido = pilhaPessoas.pop();

      alert(
        'Removido: ' +
        removido.nome +
        ' - ' +
        removido.regime +
        ' - ' +
        removido.cargaHoraria + 'h'
      );

      mostrarLista();
    }
  }

  function inverterPilha() {
    pilhaPessoas.reverse();
    mostrarLista();
  }

  function salvar() {

    const nome = document.getElementById('nome').value;
    const regime = document.getElementById('regime').value;
    const cargaHoraria = document.getElementById('cargaHoraria').value;

    if (nome === '' || regime === '' || cargaHoraria === '') {
      alert('Preencha todos os campos!');
      return;
    }

    const pessoa = {
      nome: nome,
      regime: regime,
      cargaHoraria: cargaHoraria
    };

    if (indiceEdicao === null) {
      pilhaPessoas.push(pessoa);
    } else {
      pilhaPessoas[indiceEdicao] = pessoa;
    }

    limpaCampos();
    mostrarLista();
  }

  function editarContato(indice) {

    const pessoa = pilhaPessoas[indice];

    document.getElementById('nome').value = pessoa.nome;
    document.getElementById('regime').value = pessoa.regime;
    document.getElementById('cargaHoraria').value = pessoa.cargaHoraria;

    indiceEdicao = indice;
  }

  function removerContato(indice) {

    pilhaPessoas.splice(indice, 1);

    mostrarLista();
  }

</script>
