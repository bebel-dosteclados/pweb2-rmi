<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <title>Cadastro de Cursos</title>

  <script>

    let pilhaCursos = [];

    let indiceEdicao = null; // controla se estamos editando alguém

    function mostrarLista() {
      const corpo = document.getElementById('tabelaCorpo');
      corpo.innerHTML = ''; // limpa o corpo da tabela

      for (let i = 0; i < pilhaCursos.length; i++) {
        const curso = pilhaCursos[i];

        const linha =
          "<tr>" +
            "<td>" + i + "</td>" +
            "<td>" + curso.nome + "</td>" +
            "<td>" + curso.regime + "</td>" +
            "<td>" + curso.cargaHoraria + "h</td>" +
            "<td>" +
              "<div class='mt-3 d-flex gap-2'>" +
                "<button class='btn btn-secondary' onclick='editarContato(" + i + ")'>Editar</button>" +
                "<button class='btn btn-danger' onclick='removerContato(" + i + ")'>Remover</button>" +
              "</div>" +
            "</td>" +
          "</tr>";

        corpo.innerHTML += linha;
      }
    }
